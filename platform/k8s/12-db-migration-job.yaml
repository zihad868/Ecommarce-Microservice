apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-migration
  namespace: ecommerce
  labels:
    app: identity-service
    job-type: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: identity-service
        job-type: db-migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: auth-db-migrate
          image: identity-service:dev
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/node_modules/prisma/build/index.js
            - migrate
            - deploy
            - --schema
            - /app/services/identity-service/prisma/schema.prisma
          envFrom:
            - secretRef:
                name: identity-service-secret
          env:
            - name: PORT
              value: '3001'
            - name: GRPC_PORT
              value: '50051'
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-service-secret
                  key: DIRECT_DATABASE_URL
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
