apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: identity-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ecommerce/staging/identity-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
