# Development template only. Managed overlays use ExternalSecret resources.
# Replace every placeholder in an ignored copy before applying to ecommerce-dev.
apiVersion: v1
kind: Secret
metadata: { name: identity-service-secret, namespace: ecommerce-dev }
type: Opaque
stringData:
  DATABASE_URL: postgresql://auth_user:REPLACE@auth-db-service:5432/auth_db?connection_limit=5&pool_timeout=10
  DIRECT_DATABASE_URL: postgresql://auth_user:REPLACE@auth-db-service:5432/auth_db
  JWT_PRIVATE_KEY: REPLACE_WITH_PRIVATE_PEM
  JWT_PUBLIC_KEY: REPLACE_WITH_PUBLIC_PEM
  REDIS_HOST: redis-service
  REDIS_PORT: '6379'
---
