  DIRECT_DATABASE_URL: postgresql://product_user:REPLACE@product-db-service:5432/product_db
  KAFKA_BROKER: kafka-service:9092
  REDIS_HOST: redis-service
  REDIS_PORT: '6379'
  ORDER_GRPC_URL: order-service:50053
---
apiVersion: v1
