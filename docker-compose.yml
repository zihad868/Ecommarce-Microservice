{
  'name': 'ecommerce',
  'services':
    {
      'kafka':
        {
          'image': 'confluentinc/cp-kafka:7.6.0',
          'ports': ['9093:9093'],
          'environment':
            {
              'CLUSTER_ID': 'MkU3OEVBNTcwNTJENDM2Qk',
              'KAFKA_NODE_ID': 1,
              'KAFKA_PROCESS_ROLES': 'broker,controller',
              'KAFKA_CONTROLLER_QUORUM_VOTERS': '1@kafka:9094',
              'KAFKA_LISTENERS': 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,EXTERNAL://0.0.0.0:9093',
              'KAFKA_ADVERTISED_LISTENERS': 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093',
              'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP': 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT',
              'KAFKA_CONTROLLER_LISTENER_NAMES': 'CONTROLLER',
              'KAFKA_INTER_BROKER_LISTENER_NAME': 'PLAINTEXT',
              'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR': 1,
              'KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR': 1,
              'KAFKA_TRANSACTION_STATE_LOG_MIN_ISR': 1,
              'KAFKA_LOG_DIRS': '/var/lib/kafka/data',
            },
          'healthcheck':
            {
              'test': ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092'],
              'interval': '15s',
              'timeout': '10s',
              'retries': 8,
              'start_period': '30s',
            },
          'volumes': ['kafka_data:/var/lib/kafka/data'],
        },
      'redis':
        {
          'image': 'redis:7-alpine',
          'ports': ['6379:6379'],
          'command': ['redis-server', '--appendonly', 'yes'],
          'volumes': ['redis_data:/data'],
          'healthcheck':
            {
              'test': ['CMD', 'redis-cli', 'ping'],
              'interval': '10s',
              'timeout': '5s',
              'retries': 5,
            },
        },
      'auth-db':
        {
          'image': 'postgres:15-alpine',
          'ports': ['5433:5432'],
          'environment':
            {
              'POSTGRES_USER': '${AUTH_DB_USER}',
              'POSTGRES_PASSWORD': '${AUTH_DB_PASSWORD}',
              'POSTGRES_DB': '${AUTH_DB_NAME}',
            },
          'volumes': ['auth_db_data:/var/lib/postgresql/data'],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'],
              'interval': '10s',
              'timeout': '5s',
              'retries': 5,
            },
        },
      'product-db':
        {
          'image': 'postgres:15-alpine',
          'ports': ['5435:5432'],
          'environment':
            {
              'POSTGRES_USER': '${PRODUCT_DB_USER}',
              'POSTGRES_PASSWORD': '${PRODUCT_DB_PASSWORD}',
              'POSTGRES_DB': '${PRODUCT_DB_NAME}',
            },
          'volumes': ['product_db_data:/var/lib/postgresql/data'],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'],
              'interval': '10s',
              'timeout': '5s',
              'retries': 5,
            },
        },
      'order-db':
        {
          'image': 'postgres:15-alpine',
          'ports': ['5434:5432'],
          'environment':
            {
              'POSTGRES_USER': '${ORDER_DB_USER}',
              'POSTGRES_PASSWORD': '${ORDER_DB_PASSWORD}',
              'POSTGRES_DB': '${ORDER_DB_NAME}',
            },
          'volumes': ['order_db_data:/var/lib/postgresql/data'],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'],
              'interval': '10s',
              'timeout': '5s',
              'retries': 5,
            },
        },
      'identity-service':
        {
          'build':
            {
              'context': '.',
              'dockerfile': 'platform/docker/Dockerfile',
              'args': { 'WORKSPACE': 'identity-service' },
            },
          'ports': ['3001:3001', '50051:50051'],
          'environment':
            {
              'PORT': 3001,
              'GRPC_PORT': 50051,
              'DATABASE_URL': 'postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}?schema=public',
              'REDIS_HOST': 'redis',
              'REDIS_PORT': 6379,
              'AUTH_GRPC_URL': 'identity-service:50051',
              'PRODUCT_GRPC_URL': 'catalog-service:50052',
              'KAFKA_BROKER': 'kafka:9092',
              'OTEL_SERVICE_NAME': 'identity-service',
              'JWT_SECRET': '${JWT_SECRET}',
              'JWT_REFRESH_SECRET': '${JWT_REFRESH_SECRET}',
              'OTEL_EXPORTER_OTLP_ENDPOINT': '${OTEL_EXPORTER_OTLP_ENDPOINT:-}',
            },
          'depends_on':
            {
              'auth-db': { 'condition': 'service_healthy' },
              'redis': { 'condition': 'service_healthy' },
            },
          'command':
            [
              'sh',
              '-c',
              './../../node_modules/.bin/prisma migrate deploy && exec node --require @ecommerce/observability/dist/tracing.js dist/server.js',
            ],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'wget -qO- http://localhost:3001/health/ready || exit 1'],
              'interval': '15s',
              'timeout': '8s',
              'retries': 5,
              'start_period': '40s',
            },
        },
      'catalog-service':
        {
          'build':
            {
              'context': '.',
              'dockerfile': 'platform/docker/Dockerfile',
              'args': { 'WORKSPACE': 'catalog-service' },
            },
          'ports': ['3002:3002', '50052:50052'],
          'environment':
            {
              'PORT': 3002,
              'GRPC_PORT': 50052,
              'DATABASE_URL': 'postgresql://${PRODUCT_DB_USER}:${PRODUCT_DB_PASSWORD}@product-db:5432/${PRODUCT_DB_NAME}?schema=public',
              'REDIS_HOST': 'redis',
              'REDIS_PORT': 6379,
              'AUTH_GRPC_URL': 'identity-service:50051',
              'PRODUCT_GRPC_URL': 'catalog-service:50052',
              'KAFKA_BROKER': 'kafka:9092',
              'OTEL_SERVICE_NAME': 'catalog-service',
              'OTEL_EXPORTER_OTLP_ENDPOINT': '${OTEL_EXPORTER_OTLP_ENDPOINT:-}',
            },
          'depends_on':
            {
              'product-db': { 'condition': 'service_healthy' },
              'redis': { 'condition': 'service_healthy' },
              'kafka': { 'condition': 'service_healthy' },
              'identity-service': { 'condition': 'service_healthy' },
            },
          'command':
            [
              'sh',
              '-c',
              './../../node_modules/.bin/prisma migrate deploy && exec node --require @ecommerce/observability/dist/tracing.js dist/server.js',
            ],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'wget -qO- http://localhost:3002/health/ready || exit 1'],
              'interval': '15s',
              'timeout': '8s',
              'retries': 5,
              'start_period': '40s',
            },
        },
      'order-service':
        {
          'build':
            {
              'context': '.',
              'dockerfile': 'platform/docker/Dockerfile',
              'args': { 'WORKSPACE': 'order-service' },
            },
          'ports': ['3003:3003', '50053:50053'],
          'environment':
            {
              'PORT': 3003,
              'GRPC_PORT': 50053,
              'DATABASE_URL': 'postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-db:5432/${ORDER_DB_NAME}?schema=public',
              'REDIS_HOST': 'redis',
              'REDIS_PORT': 6379,
              'AUTH_GRPC_URL': 'identity-service:50051',
              'PRODUCT_GRPC_URL': 'catalog-service:50052',
              'KAFKA_BROKER': 'kafka:9092',
              'OTEL_SERVICE_NAME': 'order-service',
              'OTEL_EXPORTER_OTLP_ENDPOINT': '${OTEL_EXPORTER_OTLP_ENDPOINT:-}',
            },
          'depends_on':
            {
              'order-db': { 'condition': 'service_healthy' },
              'redis': { 'condition': 'service_healthy' },
              'kafka': { 'condition': 'service_healthy' },
              'identity-service': { 'condition': 'service_healthy' },
              'catalog-service': { 'condition': 'service_healthy' },
            },
          'command':
            [
              'sh',
              '-c',
              './../../node_modules/.bin/prisma migrate deploy && exec node --require @ecommerce/observability/dist/tracing.js dist/server.js',
            ],
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'wget -qO- http://localhost:3003/health/ready || exit 1'],
              'interval': '15s',
              'timeout': '8s',
              'retries': 5,
              'start_period': '40s',
            },
        },
      'api-gateway':
        {
          'build':
            {
              'context': '.',
              'dockerfile': 'platform/docker/Dockerfile',
              'args': { 'WORKSPACE': 'api-gateway' },
            },
          'ports': ['8081:8081'],
          'environment':
            {
              'PORT': 8081,
              'AUTH_GRPC_URL': 'identity-service:50051',
              'PRODUCT_GRPC_URL': 'catalog-service:50052',
              'ORDER_GRPC_URL': 'order-service:50053',
              'REDIS_HOST': 'redis',
              'REDIS_PORT': 6379,
              'OTEL_SERVICE_NAME': 'api-gateway',
              'OTEL_EXPORTER_OTLP_ENDPOINT': '${OTEL_EXPORTER_OTLP_ENDPOINT:-}',
            },
          'depends_on':
            {
              'identity-service': { 'condition': 'service_healthy' },
              'catalog-service': { 'condition': 'service_healthy' },
              'order-service': { 'condition': 'service_healthy' },
              'redis': { 'condition': 'service_healthy' },
            },
          'healthcheck':
            {
              'test': ['CMD-SHELL', 'wget -qO- http://localhost:8081/health/ready || exit 1'],
              'interval': '15s',
              'timeout': '8s',
              'retries': 5,
            },
        },
      'prometheus':
        {
          'image': 'prom/prometheus:v2.51.0',
          'profiles': ['observability'],
          'ports': ['9090:9090'],
          'volumes':
            [
              './platform/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro',
              './platform/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro',
              'prometheus_data:/prometheus',
            ],
        },
      'grafana':
        {
          'image': 'grafana/grafana:10.4.1',
          'profiles': ['observability'],
          'ports': ['3000:3000'],
          'environment':
            {
              'GF_SECURITY_ADMIN_PASSWORD': '${GRAFANA_ADMIN_PASSWORD}',
              'GF_USERS_ALLOW_SIGN_UP': 'false',
            },
          'volumes':
            [
              './platform/observability/grafana/provisioning:/etc/grafana/provisioning:ro',
              'grafana_data:/var/lib/grafana',
            ],
          'depends_on': ['prometheus'],
        },
      'otel-collector':
        {
          'image': 'otel/opentelemetry-collector-contrib:0.96.0',
          'profiles': ['observability'],
          'command': ['--config=/etc/otelcol/config.yaml'],
          'ports': ['4317:4317', '4318:4318'],
          'volumes': ['./platform/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro'],
        },
    },
  'volumes':
    {
      'kafka_data': {},
      'redis_data': {},
      'auth_db_data': {},
      'product_db_data': {},
      'order_db_data': {},
      'prometheus_data': {},
      'grafana_data': {},
    },
}
