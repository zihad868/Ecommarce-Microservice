services:

  # ── Kafka Broker (KRaft mode — no Zookeeper needed!) ───────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # ── KRaft mode (Kafka manages itself — no Zookeeper) ──────────────────
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"            # fixed random cluster ID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller            # একই node broker + controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094      # নিজেই voter

      # ── Listeners ────────────────────────────────────────────────────────
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── Topic / Replication settings ─────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Kafka UI (Management Dashboard) ────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy


  # ── Shared Cache (Redis) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth DB (PostgreSQL — dedicated instance) ──────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Order DB (PostgreSQL — dedicated instance) ─────────────────────────────
  order-db:
    image: postgres:15-alpine
    container_name: order-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
      POSTGRES_DB: order_db
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Product DB (PostgreSQL — dedicated instance) ──────────────────────────────
  product-db:
    image: postgres:15-alpine
    container_name: product-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
      POSTGRES_DB: product_db
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
      - "50051:50051"
    environment:
      - PORT=3001
      - GRPC_PORT=50051
      - DATABASE_URL=postgresql://auth_user:auth_password@auth-db:5432/auth_db?schema=public
      - JWT_SECRET=supersecret123_change_in_production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Product Service ────────────────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    container_name: product-service
    ports:
      - "3002:3002"
      - "50052:50052"
    environment:
      - PORT=3002
      - GRPC_PORT=50052
      - DATABASE_URL=postgresql://product_user:product_password@product-db:5432/product_db?schema=public
      - KAFKA_BROKER=kafka:9092
      - AUTH_GRPC_URL=auth-service:50051
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Order Service ──────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: order-service
    ports:
      - "3003:3003"
      - "50053:50053"
    environment:
      - PORT=3003
      - GRPC_PORT=50053
      - DATABASE_URL=postgresql://order_user:order_password@order-db:5432/order_db?schema=public
      - KAFKA_BROKER=kafka:9092
      - AUTH_GRPC_URL=auth-service:50051
      - PRODUCT_GRPC_URL=product-service:50052
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── Named Volumes (data persisted across container restarts) ───────────────
volumes:
  redis_data:
  auth_db_data:
  order_db_data:
  product_db_data:
