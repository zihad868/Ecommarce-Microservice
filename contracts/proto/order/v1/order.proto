syntax = "proto3";

package order.v1;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse) {}
  // Retained for wire compatibility; no payment simulation is implemented.
  rpc PayOrder (PayOrderRequest) returns (OrderResponse) { option deprecated = true; }
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (OrderResponse) {}
  rpc ReconcileReservation (OrderRequest) returns (ReconcileReservationResponse) {}
  rpc GetOrder (OrderRequest) returns (OrderResponse) {}
  rpc GetOrdersByUser (UserOrdersRequest) returns (UserOrdersResponse) {}
}

message OrderRequest {
  string orderId = 1;
}

message OrderResponse {
  bool success = 1;
  string id = 2;
  string userId = 3;
  double totalAmount = 4;
  string status = 5;
  string error = 6;
}

message UserOrdersRequest {
  string userId = 1;
  int32 limit = 2;
  string cursor = 3;
}

message UserOrdersResponse {
  bool success = 1;
  repeated OrderResponse orders = 2;
  string error = 3;
  string nextCursor = 4;
}

message OrderItemInput { string productId = 1; uint32 quantity = 2; }
message CreateOrderRequest { repeated OrderItemInput items = 1; string idempotencyKey = 2; }
message PayOrderRequest { string orderId = 1; string paymentMethod = 2; }
message UpdateOrderStatusRequest { string orderId = 1; string status = 2; }
message ReconcileReservationResponse { bool release = 1; bool commit = 2; }
