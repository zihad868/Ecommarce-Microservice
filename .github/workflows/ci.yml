name: Workspace CI

on:
  push:
    branches: [main, master, zihad]
    paths:
      - 'services/**'
      - 'edge/**'
      - 'packages/**'
      - 'contracts/**'
      - 'tools/**'
      - 'platform/**'
      - '*.json'
      - 'eslint.config.mjs'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, zihad]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.paths.outputs.services }}
      images: ${{ steps.paths.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node tools/affected-workspaces.mjs "$BASE" HEAD
          else
            node tools/affected-workspaces.mjs
          fi

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run contracts:check
      - run: npm run contracts:generate
      - run: git diff --exit-code -- packages/proto-gen/src/generated
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
      - run: npm run contracts:lint
      - name: Check existing contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git cat-file -e "$BASE:contracts/buf.yaml" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/contracts-base"
            git archive "$BASE" contracts | tar -x -C "$RUNNER_TEMP/contracts-base"
            buf breaking contracts --against "$RUNNER_TEMP/contracts-base/contracts"
          else
            echo 'First introduction of versioned contracts; no versioned baseline exists.'
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm exec -- turbo run build typecheck --filter='./packages/*' --output-logs=errors-only
      - name: Validate Compose and Kubernetes rendering
        run: |
          docker compose --env-file .env.example config --quiet
          for environment in dev staging prod; do
            kubectl kustomize "platform/k8s/overlays/$environment" > /dev/null
          done

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Build and typecheck changed service with package dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: npm exec -- turbo run build typecheck --filter="$SERVICE" --output-logs=errors-only

  docker:
    needs: [changes, shared, service]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/docker/Dockerfile
          build-args: WORKSPACE=${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:test
