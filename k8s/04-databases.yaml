# ─────────────────────────────────────────────────────────────────────────────
# DATABASES — PostgreSQL StatefulSets (Auth, Product, Order)
#
# Production Recommendation:
#   AWS RDS PostgreSQL (Multi-AZ) ব্যবহার করুন:
#   - Automated backups
#   - Point-in-time recovery
#   - Read replicas
#   এই StatefulSet শুধু self-managed/staging এর জন্য
# ─────────────────────────────────────────────────────────────────────────────

# ═════════════════════════════════════════════════════════════════════════════
# AUTH DATABASE
# ═════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: ecommerce
  labels:
    app: auth-db
    tier: database
    db: postgres
spec:
  serviceName: auth-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
        tier: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"    # postgres_exporter port (monitoring)
    spec:
      # ── Security Context ─────────────────────────────────────────────────
      securityContext:
        runAsUser: 999     # postgres user UID
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true

      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP

          # Secrets থেকে environment variables
          envFrom:
            - secretRef:
                name: auth-db-secret

          # Non-sensitive config
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --locale=en_US.UTF-8"

          # ── Resource Requests & Limits ──────────────────────────────────
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/postgresql/data

          # ── Health Probes ───────────────────────────────────────────────
          livenessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "auth_user"
                - "-d"
                - "auth_db"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "auth_user"
                - "-d"
                - "auth_db"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "auth_user"
                - "-d"
                - "auth_db"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12   # 60s startup window

          # ── Container Security ──────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Postgres writes to /var/lib/postgresql
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID

      terminationGracePeriodSeconds: 60

  volumeClaimTemplates:
    - metadata:
        name: auth-db-data
        labels:
          app: auth-db
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 10Gi

---

# ── Auth DB Headless Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-db-headless
  namespace: ecommerce
  labels:
    app: auth-db
spec:
  clusterIP: None
  selector:
    app: auth-db
  ports:
    - port: 5432
      name: postgres

---

# ── Auth DB Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-db-service
  namespace: ecommerce
  labels:
    app: auth-db
    tier: database
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
      protocol: TCP
  type: ClusterIP

---

