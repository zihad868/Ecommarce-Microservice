# ─────────────────────────────────────────────────────────────────────────────
# AUTH DATABASE — PostgreSQL StatefulSet
# Production এ AWS RDS PostgreSQL ব্যবহার strongly recommended
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: ecommerce
  labels:
    app: auth-db
    tier: database
spec:
  serviceName: auth-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: auth-db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "auth_user"
                - "-d"
                - "auth_db"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "auth_user"
                - "-d"
                - "auth_db"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: auth-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 10Gi

---

apiVersion: v1
kind: Service
metadata:
  name: auth-db-headless
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: auth-db
  ports:
    - port: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: auth-db-service
  namespace: ecommerce
  labels:
    app: auth-db
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---

