# ─────────────────────────────────────────────────────────────────────────────
# AUTH SERVICE
# - min 2 pods, max 8 pods (HPA CPU/Memory-based scaling)
# - Zero downtime Rolling Update
# - SecurityContext: non-root user
# - DB Migration: আলাদা Job-এ (12-db-migration-job.yaml)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
    tier: service
    version: "1.0"
spec:
  replicas: 2                   # HPA এর সাথে কাজ করবে (initial 2 pods)
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1               # একসাথে 1 নতুন pod আসতে পারবে
      maxUnavailable: 0         # zero downtime — সবসময় সব pods ready থাকবে
  template:
    metadata:
      labels:
        app: auth-service
        tier: service
        version: "1.0"
      annotations:
        # Prometheus metrics scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # ── Pod anti-affinity: দুটো pod কখনো একই node-এ যাবে না ──────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - auth-service
                topologyKey: kubernetes.io/hostname

      # ── Pod-level Security Context ─────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001        # Node.js app non-root user
        runAsGroup: 1001
        fsGroup: 1001

      # ── Service Account ────────────────────────────────────────────────────
      # Specific service account ব্যবহার করুন (least privilege)
      automountServiceAccountToken: false

      containers:
        - name: auth-service
          image: auth-service:1.0.0
          # Production-এ: Always (যাতে latest image সবসময় pull হয়)
          # Local dev-এ: IfNotPresent
          imagePullPolicy: Always

          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
            - containerPort: 50051
              name: grpc
              protocol: TCP

          # ── Environment Variables ──────────────────────────────────────────
          env:
            - name: PORT
              value: "3001"
            - name: GRPC_PORT
              value: "50051"
            - name: NODE_ENV
              value: "production"

          # Secrets থেকে sensitive config
          envFrom:
            - secretRef:
                name: auth-service-secret
            # Non-sensitive config (optional — directly env-এ দেওয়া আছে)
            # - configMapRef:
            #     name: app-config

          # ── Resource Requests & Limits ─────────────────────────────────────
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"       # HPA এই CPU দেখে scale করবে
            limits:
              memory: "512Mi"
              cpu: "500m"

          # ── Health Probes ──────────────────────────────────────────────────

          # startupProbe: app শুরু হওয়ার সময় চলে
          # এটা pass করার আগে liveness/readiness check হয় না
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15   # 75s startup window (Prisma migration সহ)
            successThreshold: 1

          # livenessProbe: app জীবিত আছে কিনা — fail হলে restart হবে
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 0    # startupProbe এর পরে শুরু হয়
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # readinessProbe: traffic পাঠানো হবে কিনা — fail হলে Service এর endpoint থেকে বাদ
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Container Security ─────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ── Volume Mounts (readOnlyRootFilesystem-এর জন্য writable tmp) ───
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}

      # ── Graceful termination ─────────────────────────────────────────────
      # চলমান requests শেষ হওয়ার সুযোগ দেবে
      terminationGracePeriodSeconds: 30

---

# ── Auth Service — ClusterIP Service ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
    tier: service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP

---

# ── HPA: Horizontal Pod Autoscaler ───────────────────────────────────────────
# CPU > 70% বা Memory > 80% হলে scale up
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2          # সবসময় minimum 2 pods (high availability)
  maxReplicas: 8          # maximum 8 pods পর্যন্ত scale
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # CPU 70% হলে scale up শুরু
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Memory 80% হলে scale up
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # 60s দেখার পরে scale up
      policies:
        - type: Pods
          value: 2                      # একবারে max 2 pod বাড়াবে
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 মিনিট stable থাকলে scale down
      policies:
        - type: Pods
          value: 1                      # একবারে max 1 pod কমাবে
          periodSeconds: 120

---

# ── PodDisruptionBudget ───────────────────────────────────────────────────────
# Rolling update বা node drain-এর সময় minimum 1 pod সচল থাকবে
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: ecommerce
spec:
  minAvailable: 1    # 2 pods-এর মধ্যে min 1 সবসময় সচল
  selector:
    matchLabels:
      app: auth-service
