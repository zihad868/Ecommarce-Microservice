# ─────────────────────────────────────────────────────────────────────────────
# SECRETS — সব sensitive data এখানে থাকবে
#
# ⚠️  IMPORTANT SECURITY WARNING:
#     এই ফাইলটি কখনো git-এ commit করবেন না!
#     .gitignore-এ যোগ করুন: k8s/01-secrets.yaml
#
# Production-এ করণীয়:
#   Option 1: AWS Secrets Manager + External Secrets Operator
#   Option 2: HashiCorp Vault + Vault Agent Injector
#   Option 3: Sealed Secrets (Bitnami) — git-safe encrypted secrets
#
# Base64 encode করার command:
#   echo -n "your-password" | base64
#
# Base64 decode করার command:
#   echo "encoded-value" | base64 --decode
# ─────────────────────────────────────────────────────────────────────────────

# ── Auth Service Secret ───────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ecommerce
  labels:
    app: auth-service
    tier: secret
  annotations:
    # Last rotated date track করুন
    secret/last-rotated: "2024-01-01"
    secret/managed-by: "manual"
type: Opaque
# stringData → K8s নিজেই base64 করে নেয় (development এ সুবিধাজনক)
# Production-এ 'data' field ব্যবহার করুন (pre-encoded base64 values)
stringData:
  DATABASE_URL: "postgresql://auth_user:CHANGE_THIS_PASSWORD@auth-db-service:5432/auth_db?schema=public"
  # JWT_SECRET অবশ্যই 256-bit random string হওয়া উচিত:
  # openssl rand -hex 32
  JWT_SECRET: "CHANGE_THIS_TO_A_STRONG_256BIT_SECRET_KEY_IN_PRODUCTION"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---

# ── Product Service Secret ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: ecommerce
  labels:
    app: product-service
    tier: secret
  annotations:
    secret/last-rotated: "2024-01-01"
    secret/managed-by: "manual"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://product_user:CHANGE_THIS_PASSWORD@product-db-service:5432/product_db?schema=public"
  KAFKA_BROKER: "kafka-service:9092"
  AUTH_GRPC_URL: "auth-service:50051"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---

