# ── Auth DB Secret ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: ecommerce
  labels:
    app: auth-db
    tier: secret
type: Opaque
stringData:
  POSTGRES_USER: "auth_user"
  POSTGRES_PASSWORD: "CHANGE_THIS_TO_STRONG_PASSWORD"
  POSTGRES_DB: "auth_db"

