# ─────────────────────────────────────────────────────────────────────────────
# SECRETS — সব sensitive data এখানে থাকবে
# Production-এ AWS Secrets Manager / SSM Parameter Store ব্যবহার করুন
# নিচের values গুলো base64 encoded হতে হবে:
#   echo -n "your-value" | base64
# ─────────────────────────────────────────────────────────────────────────────

# ── Auth Service Secret ───────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://auth_user:auth_password@auth-db-service:5432/auth_db?schema=public"
  JWT_SECRET: "supersecret123_CHANGE_THIS_IN_PRODUCTION_use_256bit_key"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---

# ── Product Service Secret ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://product_user:product_password@product-db-service:5432/product_db?schema=public"
  KAFKA_BROKER: "kafka-service:9092"
  AUTH_GRPC_URL: "auth-service:50051"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---

# ── Order Service Secret ──────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://order_user:order_password@order-db-service:5432/order_db?schema=public"
  KAFKA_BROKER: "kafka-service:9092"
  AUTH_GRPC_URL: "auth-service:50051"
  PRODUCT_GRPC_URL: "product-service:50052"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---

# ── Auth DB Secret ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "auth_user"
  POSTGRES_PASSWORD: "auth_password"
  POSTGRES_DB: "auth_db"

---

# ── Product DB Secret ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: product-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "product_user"
  POSTGRES_PASSWORD: "product_password"
  POSTGRES_DB: "product_db"

---

# ── Order DB Secret ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "order_user"
  POSTGRES_PASSWORD: "order_password"
  POSTGRES_DB: "order_db"
