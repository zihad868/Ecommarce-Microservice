apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - 00-namespace.yaml
  - 02-redis.yaml
  - 03-kafka.yaml
  - 04-databases.yaml
  - 05-auth-service.yaml
  - 06-product-service.yaml
  - 07-order-service.yaml
  - 08-ingress.yaml

# Set these three newName values to the immutable image repositories used by CI/CD.
images:
  - name: auth-service
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/auth-service
    newTag: "1.0.0"
  - name: product-service
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/product-service
    newTag: "1.0.0"
  - name: order-service
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/order-service
    newTag: "1.0.0"