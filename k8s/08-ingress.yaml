# ─────────────────────────────────────────────────────────────────────────────
# INGRESS — NGINX Ingress Controller
#
# Prerequisites (একবার cluster-এ install করুন):
#   # AWS EKS:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/aws/deploy.yaml
#
# TLS Certificate (cert-manager দিয়ে Let's Encrypt):
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Main Ingress — সব API routes ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  labels:
    app: ecommerce
  annotations:
    # ── Ingress Class (kubernetes.io/ingress.class deprecated হয়ে গেছে!) ───
    # spec.ingressClassName ব্যবহার করুন (নিচে দেওয়া আছে)

    # ── Rate Limiting (Global) ─────────────────────────────────────────────
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # ── Proxy / Timeout settings ───────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"

    # ── SSL Redirect (HTTPS enforce) ───────────────────────────────────────
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # ── TLS Certificate (cert-manager) ─────────────────────────────────────
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── CORS ──────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://yourdomain.com"    # ← আপনার frontend domain

    # ── Security Headers ──────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

spec:
  # ── Ingress Class (deprecated annotation-এর পরিবর্তে এটা ব্যবহার করুন) ──
  ingressClassName: nginx

  # ── TLS Configuration ─────────────────────────────────────────────────────
  tls:
    - hosts:
        - api.yourdomain.com    # ← আপনার domain দিন
      secretName: ecommerce-tls   # cert-manager এটা auto-create করবে

  # ── Routing Rules ─────────────────────────────────────────────────────────
  rules:
    - host: api.yourdomain.com    # ← আপনার domain দিন
      http:
        paths:
          # ── Auth Service routes ──────────────────────────────────────────
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

          # ── Product Service routes ───────────────────────────────────────
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 3002

          # ── Order Service routes ─────────────────────────────────────────
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 3003

---

# ── Auth Service — Per-service Ingress (strict rate limiting) ─────────────────
# Auth endpoint-এ brute force attack থেকে রক্ষা করতে rate limit কড়া রাখুন
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: ecommerce
  labels:
    app: auth-service
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"          # Auth: কড়া limit (brute force protection)
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.yourdomain.com
      secretName: auth-tls
  rules:
    - host: auth.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

---

# ── Product Service — Per-service Ingress ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-service-ingress
  namespace: ecommerce
  labels:
    app: product-service
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "300"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - products.yourdomain.com
      secretName: product-tls
  rules:
    - host: products.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 3002

---

# ── Order Service — Per-service Ingress ──────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service-ingress
  namespace: ecommerce
  labels:
    app: order-service
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # Order processing সময় নিতে পারে
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - orders.yourdomain.com
      secretName: order-tls
  rules:
    - host: orders.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 3003
