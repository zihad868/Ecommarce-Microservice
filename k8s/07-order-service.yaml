# ─────────────────────────────────────────────────────────────────────────────
# ORDER SERVICE
# - min 1 pod, max 8 pods (HPA request-based scaling)
# - Request limit exceed হলে queue-তে wait করবে
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    tier: service
    version: "1.0"
spec:
  replicas: 1                   # ── initial 1 pod
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0         # zero downtime
  template:
    metadata:
      labels:
        app: order-service
        tier: service
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - order-service
                topologyKey: kubernetes.io/hostname
      
      # ── Init container: DB migration ──────────────────────────────────────
      initContainers:
        - name: db-migrate
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/order-service:latest
          command: ["sh", "-c", "npx prisma db push"]
          envFrom:
            - secretRef:
                name: order-service-secret
          env:
            - name: PORT
              value: "3003"
            - name: GRPC_PORT
              value: "50053"
      
      containers:
        - name: order-service
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
              name: http
              protocol: TCP
            - containerPort: 50053
              name: grpc
              protocol: TCP
          
          env:
            - name: PORT
              value: "3003"
            - name: GRPC_PORT
              value: "50053"
          
          envFrom:
            - secretRef:
                name: order-service-secret
          
          # ── Resource Requests & Limits ────────────────────────────────────
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # ── Health Probes ─────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      
      terminationGracePeriodSeconds: 30

---

# ── Order Service — ClusterIP Service ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      protocol: TCP
    - name: grpc
      port: 50053
      targetPort: 50053
      protocol: TCP
  type: ClusterIP

---

# ── HPA: min=1, max=8 ────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1          # ── minimum 1 pod
  maxReplicas: 8          # ── maximum 8 pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---

# ── PodDisruptionBudget ───────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
