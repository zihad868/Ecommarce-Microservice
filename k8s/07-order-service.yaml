# ─────────────────────────────────────────────────────────────────────────────
# ORDER SERVICE
# - min 2 pods, max 8 pods (HPA CPU/Memory-based scaling)
# - SecurityContext: non-root user
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    tier: service
    version: "1.0"
spec:
  replicas: 2                   # initial 2 pods (1 থেকে বাড়ানো হয়েছে — HA এর জন্য)
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0         # zero downtime
  template:
    metadata:
      labels:
        app: order-service
        tier: service
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: "/metrics"
    spec:
      # ── Pod Anti-Affinity ─────────────────────────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - order-service
                topologyKey: kubernetes.io/hostname

      # ── Pod-level Security Context ─────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      automountServiceAccountToken: false

      containers:
        - name: order-service
          image: order-service:1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 3003
              name: http
              protocol: TCP
            - containerPort: 50053
              name: grpc
              protocol: TCP

          env:
            - name: PORT
              value: "3003"
            - name: GRPC_PORT
              value: "50053"
            - name: NODE_ENV
              value: "production"

          envFrom:
            - secretRef:
                name: order-service-secret

          # ── Resource Requests & Limits ─────────────────────────────────────
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # ── Health Probes ──────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15   # 75s startup window
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Container Security ─────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30

---

# ── Order Service — ClusterIP Service ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    tier: service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      protocol: TCP
    - name: grpc
      port: 50053
      targetPort: 50053
      protocol: TCP
  type: ClusterIP

---

# ── HPA: min=2, max=8 ────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2          # 1 থেকে 2 বাড়ানো হয়েছে (single pod = single point of failure!)
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---

# ── PodDisruptionBudget ───────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: ecommerce
spec:
  minAvailable: 1    # 2 pods-এর মধ্যে min 1 সবসময় সচল
  selector:
    matchLabels:
      app: order-service
