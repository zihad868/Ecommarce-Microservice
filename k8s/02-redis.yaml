# ─────────────────────────────────────────────────────────────────────────────
# REDIS — Shared Cache (StatefulSet — Deployment থেকে পরিবর্তন করা হয়েছে)
#
# কেন StatefulSet?
# - Redis এর PVC (persistent storage) আছে
# - StatefulSet PVC এর সাথে stable binding করে
# - Deployment হলে restart-এ PVC detach/reattach issue হতে পারে
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: redis
    tier: cache
    version: "7"
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"    # redis_exporter port (monitoring)
    spec:
      # ── Security Context: non-root user-এ চালানো ─────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 999    # redis user
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          # ConfigMap থেকে redis.conf load করা
          command:
            - redis-server
            - /etc/redis/redis.conf

          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP

          # ── Resource Requests & Limits ─────────────────────────────────
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "600Mi"
              cpu: "300m"

          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true

          # ── Health Probes ──────────────────────────────────────────────
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10   # 30s startup time

          # ── Container Security ─────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Redis writes to /data
            capabilities:
              drop:
                - ALL

      volumes:
        - name: redis-config
          configMap:
            name: redis-config

      # ── Graceful shutdown ──────────────────────────────────────────────
      terminationGracePeriodSeconds: 30

  # ── Persistent Volume Claim Template ────────────────────────────────────
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2   # AWS EBS gp2 (gp3 আরো ভালো performance দেয়)
        resources:
          requests:
            storage: 5Gi

---

# ── Redis Headless Service (StatefulSet internal DNS) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ecommerce
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      name: redis

---

# ── Redis Service (Application access) ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ecommerce
  labels:
    app: redis
    tier: cache
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
  type: ClusterIP   # Internal only — redis-service:6379 দিয়ে access
